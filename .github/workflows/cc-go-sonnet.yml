name: Claude Implement Issue (Sonnet)

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  actions: read

# Per-issue concurrency: re-labeling the SAME issue cancels its
# earlier in-flight run cleanly. Cross-issue serialization is
# handled by turnstyle below.
concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  implement:
    if: github.event.label.name == 'cc-go-sonnet'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Cross-issue serialization: only one Claude run at a time
      # across the whole repo. 4-hour ceiling so a wedged run
      # can't block forever.
      - name: Wait for other Claude runs to finish
        uses: softprops/turnstyle@v3
        with:
          abort-after-seconds: 14400
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          additional_permissions: |
            actions: read
          prompt: |
            Implement issue #${{ github.event.issue.number }} per its
            acceptance criteria.

            Before you start, run `gh issue view ${{ github.event.issue.number }} --comments`
            and read all comments — I often add clarifications and
            constraints there that are not in the issue body.

            Verify every acceptance criterion is met before opening the PR.
            ultrathink before declaring the work done.

            Open a PR linked to this issue when complete.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 60
            --permission-mode bypassPermissions